name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WhichCOM.slnx

      # Unsigned build: no certificate is needed or used.
      - name: Build
        run: dotnet build WhichCOM.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WhichCOM.slnx --configuration Release --no-build

  secrets:
    name: Secret and personal data scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose'
